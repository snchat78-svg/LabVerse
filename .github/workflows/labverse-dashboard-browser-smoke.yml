name: LabVerse dashboard browser smoke

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/labverse-dashboard-browser-smoke.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/labverse-dashboard-browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pinned Playwright dependency
        run: npm install --no-package-lock

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static dashboard server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . > /tmp/labverse-dashboard-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              echo "Dashboard server ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/labverse-dashboard-http.log
          exit 1

      - name: Run desktop and mobile browser smoke tests
        run: npm run test:smoke
