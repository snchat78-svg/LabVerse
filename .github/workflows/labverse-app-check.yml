name: LabVerse React app checks

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "dashboard/data/inventory.json"
      - ".github/workflows/labverse-app-check.yml"
  pull_request:
    paths:
      - "app/**"
      - "dashboard/data/inventory.json"
      - ".github/workflows/labverse-app-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-foundation:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package.json

      - name: Install pinned dependencies
        run: npm install --no-package-lock

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Install Chromium for app smoke tests
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/labverse-app-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then
              echo "React app preview ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/labverse-app-preview.log
          exit 1

      - name: Run React app browser smoke tests
        run: npm run test:smoke
